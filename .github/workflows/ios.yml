name: iOS CI

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ios, ios-funciones]
    paths:
      - "ios/**"
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main, ios]
    paths:
      - "ios/**"
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Firebase Functions
        working-directory: functions
        run: |
          npm install
          node --check index.js

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/Pawly.xcodeproj -scheme Pawly

      - name: Build iOS Simulator
        run: xcodebuild -project ios/Pawly.xcodeproj -scheme Pawly -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
