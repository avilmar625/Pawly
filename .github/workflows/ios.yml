name: iOS CI

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  validate-worker:
    name: Type-check and test Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/cloudflare-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Type-check Worker
        run: npm run check

      - name: Run Worker unit tests
        run: npm test

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          test -f Config.local.xcconfig || cp Config.example.xcconfig Config.local.xcconfig
          xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/Pawly.xcodeproj -scheme Pawly

      - name: Build iOS Simulator
        run: xcodebuild -project ios/Pawly.xcodeproj -scheme Pawly -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
