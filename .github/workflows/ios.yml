name: iOS CI

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "backend/cloudflare-worker/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  validate-worker:
    name: Type-check and test Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/cloudflare-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Type-check Worker
        run: npm run check

      - name: Run Worker unit tests
        run: npm test

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          cp Config.example.xcconfig Config.local.xcconfig
          sed -i '' 's/^GOOGLE_CLIENT_ID =$/GOOGLE_CLIENT_ID = fixture.apps.example.invalid/; s/^GOOGLE_REVERSED_CLIENT_ID =$/GOOGLE_REVERSED_CLIENT_ID = invalid.example.apps.fixture/; s/^CLOUDINARY_CLOUD_NAME =$/CLOUDINARY_CLOUD_NAME = fixture/; s/^CLOUDINARY_IMAGE_UPLOAD_PRESET =$/CLOUDINARY_IMAGE_UPLOAD_PRESET = image-fixture/; s/^CLOUDINARY_VIDEO_UPLOAD_PRESET =$/CLOUDINARY_VIDEO_UPLOAD_PRESET = video-fixture/' Config.local.xcconfig
          xcodegen generate

      - name: Start test iPhone
        run: |
          device=$(python3 ios/Tests/simulator-id.py)
          echo "PAWLY_SIMULATOR_ID=$device" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device" -b

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/Pawly.xcodeproj -scheme Pawly

      - name: Check device push entitlements
        run: |
          for config in Debug Release; do
            xcodebuild -project ios/Pawly.xcodeproj -scheme Pawly -configuration "$config" -sdk iphoneos -showBuildSettings -json | python3 ios/Tests/check-push-config.py "$config"
          done

      - name: Test Swift contracts and translations
        run: bash ios/Tests/run.sh

      - name: Build iOS Simulator
        run: xcodebuild -project ios/Pawly.xcodeproj -scheme Pawly -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Check processed Debug configuration
        run: |
          python3 ios/Tests/check-built-config.py build/Build/Products/Debug-iphonesimulator/Pawly.app
          python3 ios/Tests/check-localizations.py --compiled build/Build/Intermediates.noindex/Pawly.build/Debug-iphonesimulator/Pawly.build/Objects-normal

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase emulators
        run: npm install -g firebase-tools

      - name: Test authentication and pet navigation on iPhone
        run: |
          firebase emulators:exec --config firebase.ios-tests.json --only auth,firestore --project demo-pawly 'xcodebuild -project ios/Pawly.xcodeproj -scheme Pawly -destination "platform=iOS Simulator,id=$PAWLY_SIMULATOR_ID" -derivedDataPath build -parallel-testing-enabled NO test'
