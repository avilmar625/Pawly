name: Pawly Firestore validation

on:
  push:
    branches:
      - cambios60-comunidad-calendario
  pull_request:
    branches:
      - cambios60-comunidad-calendario

jobs:
  firestore-rules:
    name: Validate Firestore rules with emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Parse rules and start Firestore emulator
        run: firebase emulators:exec --only firestore --project demo-pawly "echo Firestore rules parsed successfully"
