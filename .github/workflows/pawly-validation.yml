name: Pawly validation

on:
  push:
    branches:
      - cambios60-comunidad-calendario
  pull_request:
    branches:
      - cambios60-comunidad-calendario

jobs:
  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Run unit tests and build APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

  firestore-rules:
    name: Validate Firestore rules with emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Parse rules and start Firestore emulator
        run: firebase emulators:exec --only firestore --project demo-pawly "echo Firestore rules parsed successfully"
