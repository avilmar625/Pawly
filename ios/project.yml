name: Pawly
options:
  developmentLanguage: es
  bundleIdPrefix: com.pawly
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  Pawly:
    type: application
    platform: iOS

    configFiles:
      Debug: Config.local.xcconfig
      Release: Config.local.xcconfig

    sources:
      - path: Pawly
        excludes:
          - Info.plist
          - Pawly.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexvilarrubla.pawly
        PRODUCT_NAME: Pawly
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Pawly/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pawly/Pawly.entitlements
        INFOPLIST_KEY_GIDClientID: "$(GOOGLE_CLIENT_ID)"
        INFOPLIST_KEY_PAWLY_BACKEND_URL: "$(PAWLY_BACKEND_URL)"
        INFOPLIST_KEY_CFBundleDisplayName: Pawly
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Pawly necesita acceso a tus fotos para añadir imágenes de tus mascotas.
        INFOPLIST_KEY_NSCameraUsageDescription: Pawly necesita la cámara para hacer fotos de tus mascotas.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pawly necesita el micrófono para grabar vídeos.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Pawly puede usar tu ubicación para mostrar lugares y servicios cercanos para mascotas.
        INFOPLIST_KEY_CLOUDINARY_CLOUD_NAME: "$(CLOUDINARY_CLOUD_NAME)"
        INFOPLIST_KEY_CLOUDINARY_IMAGE_UPLOAD_PRESET: "$(CLOUDINARY_IMAGE_UPLOAD_PRESET)"
        INFOPLIST_KEY_CLOUDINARY_VIDEO_UPLOAD_PRESET: "$(CLOUDINARY_VIDEO_UPLOAD_PRESET)"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
  PawlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Pawly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexvilarrubla.pawly.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pawly
  PawlyIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IntegrationTests]
    dependencies:
      - target: Pawly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexvilarrubla.pawly.integrationtests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pawly:
    build:
      targets:
        Pawly: all
    test:
      commandLineArguments:
        "-PawlyLocalEmulators": true
      targets: [PawlyIntegrationTests, PawlyUITests]
